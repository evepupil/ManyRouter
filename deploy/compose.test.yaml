services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: manyrouter_test
      POSTGRES_USER: manyrouter_test
      POSTGRES_PASSWORD: manyrouter_test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manyrouter_test -d manyrouter_test"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - manyrouter_test_postgres:/var/lib/postgresql/data

volumes:
  manyrouter_test_postgres:
