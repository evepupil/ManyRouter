limitations:
  - M0 uses an existing high-privilege New API access token.
  - New API releases that require New-Api-User are supported for the initial root account with user ID 1.
  - Existing channel creation has no server-side idempotency key.
  - GroupRatio updates replace one whole option and require a single automatic writer.
  - M0 expects the acceptance user's group to have no special rule that removes the managed group.
  - User groups, user API keys, Auto groups, and request logs remain outside M0.
